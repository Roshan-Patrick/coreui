	<meta name="keywords" content="Book My Nurse, Home Nursing Services, Book a Nurse Online, Nursing Care at Home, Post-Operative Care, Home Care Treatments, Professional Home Nurses, Elderly Care, Tracheostomy, Stroke, Cancer, and Bedridden Patient Care">

  <title>Book My Nurse | Home Nursing Services | Book a Nurse Online | Nursing Care</title>

<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<app-root>
  <div class="fade show" style="text-align: center; padding-top: calc(100vh / 2); height: 100vh">
    <i class="spinner-grow spinner-grow-sm"></i>
    <span class="m-1">Loading...</span>
  </div>
</app-root>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/slick.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
<script src="assets/js/script.js"></script>



<script>
  document.addEventListener("DOMContentLoaded", function () {
      const chatNowBtn = document.getElementById("chatNowBtn");
      const floatingBtns = document.getElementById("floatingBtns");
      const referralBtn = document.getElementById("referralBtn");
      const modalRel = document.getElementById("modal-rel");
      const closeBtnRel = document.getElementById("closeBtn-rel");

      // Toggle Floating Buttons on "Chat Now" Click
      chatNowBtn.addEventListener("click", function () {
          if (floatingBtns.style.display === "flex") {
              floatingBtns.style.display = "none"; // Hide
          } else {
              floatingBtns.style.display = "flex"; // Show
          }
      });

      // Open Referral Modal
      referralBtn.addEventListener("click", function () {
          modalRel.style.display = "flex";
      });

      // Close Modal when clicking close button (×)
      closeBtnRel.addEventListener("click", function () {
          modalRel.style.display = "none";
      });

      // Close Modal when clicking outside
      window.addEventListener("click", function (event) {
          if (event.target === modalRel) {
              modalRel.style.display = "none";
          }
      });
  });

document.addEventListener("DOMContentLoaded", function () {
const referralForm = document.getElementById("referralForm");

referralForm.addEventListener("submit", function (event) {
  event.preventDefault(); // Prevent default form submission

  // Submit the form using fetch API
  fetch(referralForm.action, {
      method: referralForm.method,
      body: new FormData(referralForm),
  })
  .then(response => response.text())
  .then(data => {
      alert("Form submitted successfully!"); // Show popup message
      referralForm.reset(); // Reset the form
      document.getElementById("modal-rel").style.display = "none"; // Close modal
  })
  .catch(error => console.error("Error:", error));
});
});

</script>
</body>
</html>
